<body>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <main class="login-container">


        <section class="login-card">


            <!-- LOGO -->

            <div class="logo">
                CETA
            </div>


            <!-- TÍTULO -->

            <h1>
                Reserva de Maquetas
            </h1>


            <p class="subtitle">
                Electricidad y Electrónica Automotriz
            </p>


            <!-- =================================================
                 FORMULARIO DE ACCESO
            ================================================== -->

            <form id="loginForm">


                <!-- USUARIO -->

                <label for="usuario">
                    Usuario
                </label>


                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                    required
                >


                <!-- CONTRASEÑA -->

                <label for="password">
                    Contraseña
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >


                <!-- BOTÓN -->

                <button type="submit">
                    INICIAR SESIÓN
                </button>


                <!-- MENSAJES -->

                <p
                    id="mensaje"
                    class="mensaje"
                ></p>


            </form>


        </section>


    </main>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         CONFIGURACIÓN

    <!-- =====================================================

</body>
